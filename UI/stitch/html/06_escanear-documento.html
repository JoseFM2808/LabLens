<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen pb-24">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-container-margin h-16 bg-surface dark:bg-on-background border-b border-outline-variant dark:border-outline docked full-width top-0 sticky z-40">
<button class="text-on-surface-variant p-2 active:scale-95 transition-transform hover:bg-surface-container-high rounded-full">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary-fixed-dim">LabLens</h1>
<div class="w-10 h-10 rounded-full border border-outline-variant bg-tertiary-container overflow-hidden">
<!-- Placeholder avatar -->
</div>
</header>
<main class="px-container-margin py-md max-w-md mx-auto">
<!-- Headline -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-6 text-on-background">Escanear Documento</h2>
<!-- Viewfinder Area -->
<div class="relative w-full aspect-square bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant mb-6 flex flex-col items-center justify-center p-6 text-center">
<!-- Corner Guides -->
<div class="absolute top-4 left-4 w-12 h-12 border-t-2 border-l-2 border-primary rounded-tl-lg opacity-50"></div>
<div class="absolute top-4 right-4 w-12 h-12 border-t-2 border-r-2 border-primary rounded-tr-lg opacity-50"></div>
<div class="absolute bottom-4 left-4 w-12 h-12 border-b-2 border-l-2 border-primary rounded-bl-lg opacity-50"></div>
<div class="absolute bottom-4 right-4 w-12 h-12 border-b-2 border-r-2 border-primary rounded-br-lg opacity-50"></div>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-[200px]">Coloca tu documento médico dentro del recuadro</p>
<span class="material-symbols-outlined text-[64px] text-outline opacity-50">photo_camera</span>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-sm mb-8">
<button class="w-full h-[56px] bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full flex items-center justify-center gap-2 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">photo_camera</span>
                Tomar foto
            </button>
<button class="w-full h-[56px] bg-secondary-container text-on-secondary-container font-label-md text-label-md rounded-full flex items-center justify-center gap-2 shadow-[0px_4px_12px_rgba(0,0,0,0.05)] active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined">upload</span>
                Subir PDF
            </button>
</div>

<div class="grid grid-cols-2 gap-y-3 gap-x-2">
<div class="flex items-center gap-2 font-body-sm text-body-md">
<span class="material-symbols-outlined text-primary text-[18px]">check</span>
                    Digitalizado
                </div>
<div class="flex items-center gap-2 font-body-sm text-body-md">
<span class="material-symbols-outlined text-primary text-[18px]">check</span>
                    Analizado por IA
                </div>
<div class="flex items-center gap-2 font-body-sm text-body-md">
<span class="material-symbols-outlined text-primary text-[18px]">check</span>

                </div>
<div class="flex items-center gap-2 font-body-sm text-body-md">
<span class="material-symbols-outlined text-primary text-[18px]">check</span>
                    Añadido a historial
                </div>
</div>
